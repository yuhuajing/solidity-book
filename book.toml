[book]
authors = ["HuajingYu"]
language = "en"
src = "src"
title = "Solidity Development Book"
description = "A hands-on, EVM-first guide to Solidity smart-contract development on Ethereum — from syntax and storage layout to contract creation, calls, proxies, and advanced security."

[output.html]
smart-punctuation = true
git-repository-url = "https://github.com/yuhuajing/solidity-book"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/yuhuajing/solidity-book/edit/main/{path}"
cname = "solidity-book.com"

[preprocessor.katex]
after = ["links"]
